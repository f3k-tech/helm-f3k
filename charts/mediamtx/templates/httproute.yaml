{{- /*
Loop over protocol sections and render HTTPRoute for those with httpRoute.enabled.
Only meaningful for HTTP-based protocols (e.g., hls, webrtc), but generic on values.
*/ -}}
{{- $protocols := list "hls" "webrtc" "rtsp" "rtmp" "srt" "srpt" -}}
{{- range $p := $protocols -}}
{{- $cfg := index $.Values $p -}}
{{- if and $cfg (hasKey $cfg "httpRoute") -}}
{{- $hr := $cfg.httpRoute -}}
{{- if $hr.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "mediamtx.fullname" $ }}-{{ $p }}
  labels:
    {{- include "mediamtx.labels" $ | nindent 4 }}
  {{- with $hr.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- with $hr.parentRefs }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $hr.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range $hr.rules }}
    {{- with .matches }}
    - matches:
      {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- with .filters }}
      filters:
      {{- toYaml . | nindent 8 }}
    {{- end }}
      backendRefs:
        - name: {{ include "mediamtx.fullname" $ }}-{{ $p }}
          port: {{ $cfg.service.port }}
          weight: 1
    {{- end }}
---
{{- end -}}
{{- end -}}
{{- end -}}
