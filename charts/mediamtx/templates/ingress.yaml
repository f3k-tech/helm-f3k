{{- /*
Loop over protocol sections in values and render one Ingress per enabled protocol.
Supported keys: hls, webRtc, rtsp, rtmp, srt, srpt
Each protocol section should provide `.ingress` and `.service.port`.
*/ -}}
{{- $protocols := list "hls" "webRtc" "rtsp" "rtmp" "srt" "srpt" -}}
{{- range $p := $protocols -}}
{{- $cfg := index $.Values $p -}}
{{- if and $cfg (hasKey $cfg "ingress") -}}
{{- $ing := $cfg.ingress -}}
{{- if $ing.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "mediamtx.fullname" $ }}-{{ $p }}
  labels:
    {{- include "mediamtx.labels" $ | nindent 4 }}
  {{- with $ing.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $ing.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if $ing.tls }}
  tls:
    {{- range $ing.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range $ing.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            {{- with .pathType }}
            pathType: {{ . }}
            {{- end }}
            backend:
              service:
                name: {{ include "mediamtx.fullname" $ }}-{{ $p }}
                port:
                  number: {{ $cfg.service.port }}
          {{- end }}
    {{- end }}
---
{{- end -}}
{{- end -}}
{{- end -}}
