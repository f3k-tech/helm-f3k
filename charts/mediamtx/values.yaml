srt:
  service:
    type: ClusterIP
    port: 8890
  
  ingress:
    enabled: false
    className: ""
    annotations: {}
      # kubernetes.io/ingress.class: nginx
      # kubernetes.io/tls-acme: "true"
    hosts:
      - host: chart-example.local
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls: []
      # - secretName: chart-example-tls
      #   hosts:
      #     - chart-example.local
  
  httpRoute:
    enabled: false
    annotations: {}
    parentRefs:
    - name: gateway
      sectionName: http
