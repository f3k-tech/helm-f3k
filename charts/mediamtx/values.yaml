#       name: mediamtx-config
#   - secretRef:
#       name: mediamtx-secrets

mediamtxConfigMap:
  enabled: false
  subPath: mediamtx.yml
  mountPaths:
    - /mediamtx.yml
  data: {}
    # logLevel: info


serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}

podLabels: {}

podSecurityContext: {}
