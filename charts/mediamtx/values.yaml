replicaCount: 1

image:
  registry: docker.io/bluenviron
  repository: mediamtx
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

env: {}
