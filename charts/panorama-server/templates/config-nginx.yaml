apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "panorama-server.fullname" . }}-nginx-config
data:
  default.conf: |
    upstream php-fpm {
        server {{ include "panorama-server.fullname" . }}:9000;
    }

    server {
        listen 80;
        server_name _;

        root /var/www/html;

        index index.php index.html index.htm;

        client_max_body_size {{ .Values.nginx.config.client_max_body_size }};
        client_body_timeout {{ .Values.nginx.config.timeout }};
        send_timeout {{ .Values.nginx.config.timeout }};
        keepalive_timeout {{ .Values.nginx.config.timeout }};
        proxy_read_timeout {{ .Values.nginx.config.timeout }};
        proxy_connect_timeout {{ .Values.nginx.config.timeout }};
        proxy_send_timeout {{ .Values.nginx.config.timeout }};
        fastcgi_read_timeout {{ .Values.nginx.config.timeout }};
        fastcgi_send_timeout {{ .Values.nginx.config.timeout }};

        location ~* \.(webp)$ {
            try_files $uri =404;
        }

        location / {
            try_files $uri /index.php$is_args$args;

            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;

            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type';
                add_header 'Access-Control-Allow-Credentials' 'true';
                return 204;
            } 
        }

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass php-fpm;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }

        location ~ /\.ht {
            deny all;
        }
    }
