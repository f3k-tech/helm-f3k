apiVersion: v2
name: api-platform
description: A Helm chart for Kubernetes
type: application
version: 0.3.0
appVersion: "12"
dependencies:
  - name: mariadb
    version: 11.5.7
    repository: https://charts.bitnami.com/bitnami
    condition: mariadb.enabled
  - name: phpmyadmin
    version: 18.1.4
    repository: https://charts.bitnami.com/bitnami
    condition: phpmyadmin.enabled