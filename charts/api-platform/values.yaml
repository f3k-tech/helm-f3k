replicaCount: 1

image:
  repository: registry.git.f3k.tech/f3k/repo/development
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets:
  - name: gitlab-registry

secrets:
  appSecret: "your_app_secret_here"
  jwtPassphrase: "your_jwt_key_here"

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

persistence:
  jwtKeys:
    enabled: false
    # storageClass: "-"
    # existingClaim: api-platform-jwt-keys
    accessMode: ReadWriteOnce
    size: 1Gi
    annotations: {}

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 9000

ingress:
  enabled: false
  className: ""
  annotations:
    {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

nginx:
  enabled: true
  image: nginx:latest
  service:
    ports:
      http: 80
  config:
    custom: {}

mysql:
  enabled: true
  auth:
    rootPassword: "rootpassword"
    username: "api-platform"
    password: "mypassword"
    database: api-platform
  primary:
    persistence:
      enabled: false
      # storageClass: "-"
      # existingClaim: api-platform-mysql
      accessMode: ReadWriteOnce
      size: 10Gi
      annotations: {}

resources: {}

livenessProbe:
  enabled: false
  httpGet:
    path: /
    port: http
readinessProbe:
  enabled: false
  httpGet:
    path: /
    port: http

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

volumes: []

volumeMounts: []

nodeSelector: {}

tolerations: []

affinity: {}
