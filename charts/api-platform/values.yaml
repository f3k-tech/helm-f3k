replicaCount: 1

image:
  repository: registry.git.f3k.tech/f3k/repo/development
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets:
  - name: gitlab-registry

env: []
  # - name: RUN_MIGRAGIONS
  #   value: true
  # - name: RUN_SETUP_INDEXES
  #   value: true

# Random secrets will be automatically generated by the chart if not provided
secrets:
  appSecret: ""
  jwtPassphrase: ""
  postgres:
    # existingSecret: "api-platform-postgres"
    auth:
      username: ""
      password: ""
    annotations: {}

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations:
    {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

php:
  config:
    max_execution_time: 3600
    max_input_time: 3600
    memory_limit: 2048M
    post_max_size: 16G
    upload_max_filesize: 16G
    max_file_uploads: 20
    default_socket_timeout: 3600

mariadbIsAlive:
  enabled: true
  ssl: false
  image:
    tag: "latest"
    repository: registry.git.f3k.tech/f3k/custom-images/mariadb-isalive
    pullPolicy: IfNotPresent

importDatabase:
  enabled: false
  force: false
  ssl: false
  image:
    repository: registry.git.f3k.tech/f3k/custom-images/import-database
    tag: "latest"
    pullPolicy: IfNotPresent
  sqlDumpUrl: ""
  compressionType: "" # options: zstd, xz

# Selects which backend's DATABASE_URL is wired into the app container.
# One of: mariadb, mariadbOperator, postgresql, sqlite
# Independent of the *.enabled flags below, which only control whether each
# backend's resources are created — so mariadb and mariadbOperator can both
# be enabled at once to run them side by side while migrating data.
database:
  backend: mariadb

mariadb:
  enabled: true
  # version is used to create the api-platform url
  version: 11.4.5
  auth:
    rootPassword: ""
    username: "api-platform"
    password: ""
    database: api-platform
    # existingSecret: "api-platfom-mariadb"
  primary:
    persistence:
      enabled: false
      # storageClass: "-"
      # existingClaim: api-platform-mariadb
      accessMode: ReadWriteOnce
      size: 10Gi
      annotations: {}

mariadbOperator:
  enabled: false
  image:
    repository: mariadb
    tag: "11.4.5"
  auth:
    rootPassword: ""
    username: "api-platform"
    password: ""
    database: api-platform
    # existingSecret: "api-platform-mariadb-operator"
  storage:
    size: 10Gi
    storageClass: ""
  resources: {}
  metrics:
    enabled: false

postgresql:
  enabled: false
  instances: 1
  imageName: ""
  enableSuperuserAccess: false
  # serverVersion is used to create the api-platform url
  serverVersion: "16"
  bootstrap:
    initdb:
      database: api-platform
      owner: ""
      secret:
        name: ""
      scripts: []
  storage:
    enabled: false
    size: 10Gi
    storageClass: ""
  resources: {}
  monitoring:
    enabled: false
    podMonitorEnabled: false
  backup:
    enabled: false
    barmanObjectStore:
      destinationPath: ""
      s3Credentials:
        accessKeyId:
          name: ""
          key: ""
        secretAccessKey:
          name: ""
          key: ""
      wal:
        compression: ""
      data:
        compression: ""

persistence:
  sqlite:
    enabled: false
    # existingClaim: api-platform-sqlite
    annotations: {}
    accessMode: ReadWriteOnce
    size: 1Gi
    storageClass: ""

resources: {}

livenessProbe:
  enabled: false
  httpGet:
    path: /
    port: http
readinessProbe:
  enabled: false
  httpGet:
    path: /
    port: http

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

volumes: []

volumeMounts: []

nodeSelector: {}

tolerations: []

affinity: {}