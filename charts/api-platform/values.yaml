replicaCount: 1

image:
  repository: registry.git.f3k.tech/f3k/repo/development
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets:
  - name: gitlab-registry

# Random secrets will be automatically generated by the chart if not provided
secrets:
  appSecret: ""
  jwtPassphrase: ""

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations:
    {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

php:
  config:
    max_execution_time: 3600
    max_input_time: 3600
    memory_limit: 2048M
    post_max_size: 16G
    upload_max_filesize: 16G
    max_file_uploads: 20
    default_socket_timeout: 3600

mariadbIsAlive:
  enabled: true
  image:
    tag: "10.6.12-debian-11-r16"
    repository: bitnami/mariadb
    pullPolicy: IfNotPresent

importDatabase:
  enabled: true
  image:
    repository: registry.git.f3k.tech/f3k/custom-images/import-database
    tag: "10.6.12-debian-11-r16"
    pullPolicy: IfNotPresent
  sqlDumpUrl: example.com/dump.sql

mariadb:
  enabled: false
  auth:
    rootPassword: ""
    username: "api-platform"
    password: ""
    database: api-platform
    # existingSecret: "api-platfom-mariadb"
  primary:
    service:
      ports:
        mysql: "3306"
    persistence:
      enabled: false
      # storageClass: "-"
      # existingClaim: api-platform-mariadb
      accessMode: ReadWriteOnce
      size: 10Gi
      annotations: {}

persistence:
  sqlite:
    enabled: false
    # existingClaim: api-platform-sqlite
    annotations: {}
    accessMode: ReadWriteOnce
    size: 1Gi
    storageClass: ""

resources: {}

livenessProbe:
  enabled: false
  httpGet:
    path: /
    port: http
readinessProbe:
  enabled: false
  httpGet:
    path: /
    port: http

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

volumes: []

volumeMounts: []

nodeSelector: {}

tolerations: []

affinity: {}