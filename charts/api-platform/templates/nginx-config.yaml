apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "api-platform.fullname" . }}-nginx-config
data:
  default.conf: |
    upstream php-fpm {
        server {{ include "api-platform.fullname" . }}-php-fpm:9000;
    }

    server {
        listen 80;
        server_name _;

        root /var/www/public;
        index index.php index.html index.htm;

        client_max_body_size 1G;         
        client_body_timeout 3600s;        
        send_timeout 3600s;               
        keepalive_timeout 60s;

        # CORS Headers
        set $cors_origin "*";
        set $cors_methods "GET, POST, OPTIONS";
        set $cors_headers "Authorization, Content-Type";
        
        location / {
            try_files $uri /index.php$is_args$args;

            add_header 'Access-Control-Allow-Origin' "$cors_origin" always;
            add_header 'Access-Control-Allow-Methods' "$cors_methods" always;
            add_header 'Access-Control-Allow-Headers' "$cors_headers" always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;

            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass php-fpm;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_read_timeout 3600s;
            fastcgi_param PHP_ADMIN_VALUE "open_basedir=/var/www/public:/tmp";
        }

        location ~ /\.ht {
            deny all;
        }
    }