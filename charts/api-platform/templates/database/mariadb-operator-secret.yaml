{{- if .Values.mariadbOperator.enabled }}
{{- $vals := .Values.mariadbOperator -}}
{{- if not $vals.auth.existingSecret }}

{{- $secretName := include "api-platform.fullname-mariadb-operator" . -}}
{{- $secret := lookup "v1" "Secret" .Release.Namespace $secretName }}

{{- $items := dict
  "root-password" (dict
    "value"   $vals.auth.rootPassword
    "default" (randAlphaNum 32)
  )
  "password" (dict
    "value"   $vals.auth.password
    "default" (randAlphaNum 32)
  )
-}}

apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "api-platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ range $key, $cfg := $items }}

    {{- $existing := "" -}}
    {{- with $secret }}
      {{- $existing = (index .data $key | b64dec) | default "" -}}
    {{- end }}

    {{- $fallback := default $cfg.default $cfg.value -}}
    {{- $final := default $fallback $existing -}}
    {{ $key }}: {{ $final | quote }}
  {{ end }}
{{- end }}
{{- end }}
