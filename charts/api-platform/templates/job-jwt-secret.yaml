apiVersion: batch/v1
kind: Job
metadata:
  name: jwt-key-generator
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  template:
    spec:
      serviceAccountName: secret-manager
      restartPolicy: OnFailure
      containers:
        - name: keygen
          image: bitnami/kubectl
          command:
            - /bin/sh
            - -c
            - |
              if kubectl get secret jwt-keys -n {{ .Release.Namespace }} > /dev/null 2>&1; then
                echo "Secret jwt-keys already exists. Skipping."
                exit 0
              fi
              echo "Creating new JWT key pair..."
              openssl genpkey -algorithm RSA -out private.pem -pkeyopt rsa_keygen_bits:2048
              openssl rsa -pubout -in private.pem -out public.pem
              kubectl create secret generic jwt-keys --from-file=private.pem --from-file=public.pem -n {{ .Release.Namespace }}
              echo "Secret jwt-keys created successfully."