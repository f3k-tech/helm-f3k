{{- $appSecret := (lookup "v1" "Secret" .Release.Namespace "(include 'api-platform.fullname' .)-app") }}
{{- if not $appSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "api-platform.fullname" . }}-app
  labels:
    app.kubernetes.io/managed-by: Helm
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
type: Opaque
data:
  jwt-passphrase: {{ if eq .Values.secrets.jwtPassphrase "" }}{{ (randAlphaNum 32) | b64enc | quote }}{{ else }}{{ .Values.secrets.jwtPassphrase | b64enc | quote }}{{ end }}
  app-secret: {{ if eq .Values.secrets.appSecret "" }}{{ (randAlphaNum 32) | b64enc | quote }}{{ else }}{{ .Values.secrets.appSecret | b64enc | quote }}{{ end }}
{{- end }}

{{- if .Values.mysql.enabled }}
{{- $mysqlSecret := (lookup "v1" "Secret" .Release.Namespace "(include 'api-platform.fullname' .)-mysql") }}
{{- if not $mysqlSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "api-platform.fullname" . }}-mysql
  labels:
    app.kubernetes.io/managed-by: Helm
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
type: Opaque
data:
  mysql-root-password: {{ if eq .Values.mysql.auth.rootPassword "-" }}{{ (randAlphaNum 32) | b64enc | quote }}{{ else }}{{ .Values.mysql.auth.rootPassword | b64enc | quote }}{{ end }}
  mysql-password: {{ if eq .Values.mysql.auth.password "-" }}{{ (randAlphaNum 32) | b64enc | quote }}{{ else }}{{ .Values.mysql.auth.password | b64enc | quote }}{{ end }}
{{- end }}
{{- end }}
