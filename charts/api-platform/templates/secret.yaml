{{- $appSecret := lookup "v1" "Secret" .Release.Namespace (printf "%s-app" (include "api-platform.fullname" .)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "api-platform.fullname" . }}-app
  labels:
    app.kubernetes.io/managed-by: Helm
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
type: Opaque
data:
  jwt-passphrase: {{ if $appSecret }}{{ index $appSecret.data "jwt-passphrase" | default (.Values.secrets.jwtPassphrase | default (randAlphaNum 32) | b64enc) }}{{ else }}{{ .Values.secrets.jwtPassphrase | default (randAlphaNum 32) | b64enc }}{{ end }}
  app-secret: {{ if $appSecret }}{{ index $appSecret.data "app-secret" | default (.Values.secrets.appSecret | default (randAlphaNum 32) | b64enc) }}{{ else }}{{ .Values.secrets.appSecret | default (randAlphaNum 32) | b64enc }}{{ end }}