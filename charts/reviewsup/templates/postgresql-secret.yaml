{{- if .Values.postgresql.enabled }}
{{- $secretName := printf "%s-postgresql-app" (include "reviewsup.fullname" .) }}
{{- $secret := lookup "v1" "Secret" .Release.Namespace $secretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "reviewsup.labels" . | nindent 4 }}
type: kubernetes.io/basic-auth
stringData:
  username: {{ .Values.postgresql.bootstrap.initdb.owner }}
  {{- if $secret }}
  password: {{ index $secret.data "password" | b64dec }}
  {{- else }}
  password: {{ randAlphaNum 32 }}
  {{- end }}
{{- end }}