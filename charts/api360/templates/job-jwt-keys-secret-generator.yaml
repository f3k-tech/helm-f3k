{{- $appSecret := lookup "v1" "Secret" .Release.Namespace (printf "%s-jwt-keys" (include "api360.fullname" .)) }}
{{- if not $appSecret }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "api360.fullname" . }}-jwt-keys-secret-generator
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: secrets-generator
          image: bitnami/kubectl
          command:
            - /bin/sh
            - -c
            - |
              if kubectl get secret {{ include "api360.fullname" . }}-jwt-keys -n {{ .Release.Namespace }} > /dev/null 2>&1; then
                echo "Secret jwt-keys already exists. Skipping."
              else
                echo "Creating new JWT key pair..."
                openssl genpkey -algorithm RSA -out /tmp/private.pem -pkeyopt rsa_keygen_bits:2048
                openssl rsa -pubout -in /tmp/private.pem -out /tmp/public.pem
                kubectl create secret generic {{ include "api360.fullname" . }}-jwt-keys \
                  --from-file=/tmp/private.pem --from-file=/tmp/public.pem \
                  -n {{ .Release.Namespace }}
                echo "Secret {{ include "api360.fullname" . }}-jwt-keys created successfully."
              fi
{{- end }}